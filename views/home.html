<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacation Booking</title>
</head>

<body>
  <header>
    <img src="images/banner.jpg" alt="A sunny beachfront with sandbridge leading to small island and a woman walking towards it.">
    <h1>Book Your Dream Vacation</h1>
  </header>
  <div id="main">
    <form action="#" method="post">
      <label for="destination">Destination</label>
      <select id="destination" name="destination">
        <option value="none">Choose a Destination...</option>
        <option value="san-jose">San Jose, Costa Rica</option>
        <option value="okinawa">Naha, Okinawa, Japan</option>
        <option value="rio-de-janeiro">Rio de Janeiro, Brazil</option>
        <option value="napoli">Napoli, Italy</option>
        <option value="hawaii">Honolulu, USA</option>
      </select>

      <label for="departure">Departure Date</label>
      <input type="date" id="departure" name="departure">

      <label for="travelers">Number of Travelers</label>
      <input type="text" id="travelers" name="travelers">
    </form>
  </div>
</body>

</html>
